databases:
  - name: smartcheckout-postgres
    plan: free
    region: singapore
    databaseName: smartcheckout
    user: smartcheckout

services:
  - type: web
    name: smartcheckout-backend
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: smartcheckout-postgres
          property: connectionString
      - key: WHATSAPP_GRAPH_VERSION
        value: v19.0
